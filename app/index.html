<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ShopStation">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ShopStation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --pri:#0f766e; --pri-d:#115e59; --pri-l:#ccfbf1;
  --bg:#f3f6f5; --card:#fff; --tx:#1f2937; --mut:#6b7280; --line:#e5e7eb;
  --green:#15803d; --green-l:#dcfce7; --yellow:#b45309; --yellow-l:#fef3c7;
  --red:#b91c1c; --red-l:#fee2e2; --gray:#6b7280; --gray-l:#f3f4f6;
  --hdr:56px; --nav:62px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:fixed;top:0;left:0;right:0;height:calc(var(--hdr) + var(--safe-t));padding:var(--safe-t) 12px 0;background:var(--pri);color:#fff;display:flex;align-items:center;gap:10px;z-index:1000;box-shadow:0 1px 4px rgba(0,0,0,.15)}
header.top .brand{font-weight:700;font-size:19px;flex:1;display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden}
#title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
header.top .brand small{font-weight:400;opacity:.85;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.back{background:none;border:0;color:#fff;font-size:24px;padding:4px 8px;margin-left:-6px;cursor:pointer}
.pill{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.pill.warn{background:#f59e0b;border-color:#f59e0b}
.pill.off{background:#6b7280;border-color:#6b7280}
main{padding:calc(var(--hdr) + var(--safe-t) + 12px) 12px calc(var(--nav) + var(--safe-b) + 90px);max-width:820px;margin:0 auto}
#mapView{position:fixed;top:calc(var(--hdr) + var(--safe-t));bottom:calc(var(--nav) + var(--safe-b));left:0;right:0}
#map{position:absolute;inset:0;background:#e5e7eb}
.map-tools{position:absolute;left:58px;top:10px;z-index:500;display:flex;flex-direction:column;gap:8px}
.map-legend{position:absolute;left:10px;bottom:12px;z-index:500;background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2);display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.map-legend span{display:flex;align-items:center;gap:4px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.mapbtn{background:#fff;border:0;border-radius:10px;padding:8px 12px;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:14px;cursor:pointer}
nav.bottom{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:#fff;border-top:1px solid var(--line);display:flex;z-index:1000}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mut);gap:2px;cursor:pointer}
nav.bottom button b{font-size:21px;line-height:1;font-weight:400}
nav.bottom button{position:relative}
.nb{position:absolute;top:4px;left:50%;margin-left:6px;background:#dc2626;color:#fff;border-radius:99px;font-size:11px;font-weight:700;line-height:18px;min-width:18px;padding:0 5px;text-align:center}
nav.bottom button.on{color:var(--pri);font-weight:700}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + var(--safe-b) + 16px);z-index:900;background:var(--pri);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 4px 12px rgba(15,118,110,.4);cursor:pointer}
.fab.onmap{bottom:calc(var(--nav) + var(--safe-b) + 64px)}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid #edf0ef}
.card h2,.card h3{margin:0 0 10px;font-size:17px}
.muted{color:var(--mut)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--tx)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--red);border-color:#fecaca}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:14px}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
input.i,select.i,textarea.i{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
textarea.i{min-height:72px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--pri-l);border-color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.b-green{background:var(--green-l);color:var(--green)} .b-yellow{background:var(--yellow-l);color:var(--yellow)}
.b-red{background:var(--red-l);color:var(--red)} .b-none{background:var(--gray-l);color:var(--gray)}
.search{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search input{flex:2;min-width:160px} .search select{flex:1;min-width:120px}
.shop{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--gray-l);flex:none;display:flex;align-items:center;justify-content:center;font-size:28px}
.shop .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{width:100%;max-height:260px;object-fit:cover;border-radius:12px;background:var(--gray-l);display:block;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--mut)} .kv dd{margin:0;word-break:break-word}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sec-h h3{margin:0;flex:1;min-width:180px}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item .lbl{margin-bottom:6px}
.crit{font-size:11px;background:var(--red-l);color:var(--red);border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:700;white-space:nowrap}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tri button{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;font-size:14px;font-weight:600}
.tri button.on[data-v=y],.tri button.on[data-v=neg]{background:var(--green);border-color:var(--green);color:#fff}
.tri button.on[data-v=n],.tri button.on[data-v=pos]{background:var(--red);border-color:var(--red);color:#fff}
.tri button.on[data-v=na],.tri button.on[data-v=""]{background:#6b7280;border-color:#6b7280;color:#fff}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--pri);flex:none}
.sumbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--safe-b));background:#fff;border-top:1px solid var(--line);padding:8px 12px;z-index:950;display:flex;align-items:center;gap:10px;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.sumbar .meter{flex:1;height:10px;background:var(--gray-l);border-radius:99px;overflow:hidden}
.sumbar .meter i{display:block;height:100%;background:var(--green);width:0;transition:width .2s}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph{position:relative}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;display:block}
.photos .x{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer}
.addph{width:84px;height:84px;border:2px dashed #cbd5e1;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:12px;color:var(--mut);cursor:pointer;text-align:center}
.addph b{font-size:24px;font-weight:400}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:10px;text-align:center;border:1px solid #edf0ef}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{font-size:13px;color:var(--mut)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:#f9fafb;font-weight:700}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.bar{height:8px;background:var(--gray-l);border-radius:99px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--red)}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--gray-l);min-width:90px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--safe-b) + 80px);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:3000;max-width:90%;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 10px) 10px calc(var(--safe-b) + 10px)}
.modal .box{background:#fff;border-radius:14px;flex:1;display:flex;flex-direction:column;overflow:hidden;max-width:900px;width:100%;margin:0 auto}
.modal .box .mh{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.modal .box .mb{flex:1;position:relative}
.pin{background:none;border:0}
.leaflet-popup-content{font-family:inherit;font-size:14px;margin:10px 12px}
.pop b{font-size:15px}
.note{background:var(--yellow-l);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.info{background:var(--pri-l);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.res{border-radius:12px;padding:12px;text-align:center}
.res b{font-size:22px;display:block}
ul.tight{margin:6px 0;padding-left:20px}
.rep h1{font-size:20px;text-align:center;margin:0 0 4px}
.rep .sub{text-align:center;color:var(--mut);margin-bottom:12px}
.rep table.t td.v{text-align:center;width:70px;font-weight:700}
.ok{color:var(--green)} .ng{color:var(--red)} .na{color:var(--gray)}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px;text-align:center;font-size:14px}
.chip{display:inline-block;padding:2px 8px;border-radius:8px;background:var(--gray-l);font-size:13px;margin:2px 2px 0 0}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,#0f766e,#134e4a)}
.auth .box{background:#fff;border-radius:18px;padding:24px 20px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.auth .logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 8px}
.auth h1{text-align:center;font-size:22px;margin:0}
.auth .sub{text-align:center;color:var(--mut);font-size:14px;margin:2px 0 18px}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:16px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
#gbtn{display:flex;justify-content:center;min-height:44px}
.acct{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none;object-fit:cover}
body.authing header.top,body.authing nav.bottom,body.authing .fab,body.authing #mapView{display:none!important}
body.authing main{padding:0;max-width:none}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media print{
  header.top,nav.bottom,.fab,.noprint,.sumbar,.toast{display:none!important}
  main{padding:0;max-width:none} body{background:#fff} .card{box-shadow:none;border:0;padding:0}
}
</style>
</head>
<body>
<header class="top">
  <button class="back" id="backBtn" hidden aria-label="ย้อนกลับ">‹</button>
  <div class="brand"><span id="title">🏪 ShopStation</span><small id="subtitle"></small></div>
  <button class="pill" id="syncPill">…</button>
</header>

<div id="mapView" hidden>
  <div id="map"></div>
  <div class="map-tools">
    <button class="mapbtn" id="btnMe">📍 ตำแหน่งฉัน</button>
    <button class="mapbtn" id="btnFit">🔎 ดูทุกร้าน</button>
  </div>
  <div class="map-legend">
    <span><i class="dot" style="background:var(--green)"></i>ผ่าน</span>
    <span><i class="dot" style="background:#d97706"></i>ต้องปรับปรุง</span>
    <span><i class="dot" style="background:var(--red)"></i>ไม่ผ่าน</span>
    <span><i class="dot" style="background:#9ca3af"></i>ยังไม่ตรวจ</span>
  </div>
</div>
<main id="view"></main>

<button class="fab" id="fab" hidden>＋ เพิ่มร้านค้า</button>

<nav class="bottom">
  <button data-v="map"><b>🗺️</b>แผนที่</button>
  <button data-v="list"><b>🏪</b>ร้านค้า</button>
  <button data-v="dash"><b>📊</b>รายงาน</button>
  <button data-v="settings"><b>⚙️</b>ตั้งค่า</button>
</nav>

<script>
'use strict';
/* ====================== ตั้งค่าระบบ (ผู้ดูแลแก้ครั้งเดียว) ====================== */
const CONFIG = {
  SERVER_URL: 'https://script.google.com/macros/s/AKfycbwLkpNVx4HXPxP1DFfaUr9rlqeZk3mtwh03Om5hkcBnERdAJQLIddlXUC1sIfNoGoQ/exec',  // Web App URL ของ Apps Script เช่น 'https://script.google.com/macros/s/xxxx/exec'
};
/* ====================== แบบตรวจ (แก้ไขข้อความ/เพิ่มข้อได้ที่นี่) ====================== */
const CHECK = [
  {id:'drug', no:'2.1', title:'หมวดยา', icon:'💊', items:[
    {id:'d1', s:'ขายเฉพาะยาสามัญประจำบ้าน', label:'จำหน่ายเฉพาะ "ยาสามัญประจำบ้าน" (สังเกตกรอบสีเขียว ข้อความ "ยาสามัญประจำบ้าน" บนฉลาก)'},
    {id:'d2', s:'ไม่พบยาชุด', label:'ไม่พบยาชุด', crit:true},
    {id:'d3', s:'ไม่พบยาซองใสแก้ปวดเมื่อย', label:'ไม่พบยาซองใสแก้ปวดเมื่อย', crit:true},
    {id:'d4', s:'ไม่พบยาปฏิชีวนะ', label:'ไม่พบยาปฏิชีวนะ (แอมพิซิลลิน, อะม็อกซีซิลลิน, เตตราไซคลิน)', crit:true},
    {id:'d5', s:'ไม่พบยาแก้แพ้/ลดน้ำมูกฤทธิ์แรง', label:'ไม่พบยาแก้แพ้/ลดน้ำมูกชนิดออกฤทธิ์แรง', crit:true},
    {id:'d6', s:'ไม่พบยาปนเปื้อนสเตียรอยด์', label:'ไม่พบยาที่มีสารสเตียรอยด์ปนเปื้อน', crit:true},
    {id:'d7', s:'แยกตู้/ชั้นวางยาชัดเจน', label:'แยกตู้/ชั้นวางยาสามัญประจำบ้านออกจากสินค้าอื่นอย่างชัดเจน'}]},
  {id:'food', no:'2.2', title:'หมวดอาหารและเครื่องดื่ม', icon:'🥫', tests:true, items:[
    {id:'f1', s:'เลข อย. 13 หลักครบถ้วน', label:'ฉลากมีเลขสารบบอาหาร (เลข อย.) 13 หลัก ครบถ้วน ถูกต้อง ชัดเจน'},
    {id:'f2', s:'ไม่มีสินค้าหมดอายุ', label:'ไม่มีสินค้าหมดอายุวางปนจำหน่าย (ตรวจวันผลิต/วันหมดอายุ EXP / BBF)', crit:true},
    {id:'f3', s:'บรรจุภัณฑ์สภาพดี', label:'สภาพบรรจุภัณฑ์ดี: กระป๋องไม่บวม ไม่บุบ ไม่เป็นสนิม ซีลปิดสนิท ไม่มีรอยฉีกขาดหรือรูมดเจาะ'}]},
  {id:'cos', no:'2.3', title:'หมวดเครื่องสำอาง', icon:'💄', items:[
    {id:'c1', s:'มีเลขที่ใบรับจดแจ้ง', label:'มีเลขที่ใบรับจดแจ้ง (10 หรือ 13 หลัก) ชัดเจน'},
    {id:'c2', s:'ฉลากภาษาไทยครบถ้วน', label:'มีฉลากภาษาไทย ระบุชื่อผู้ผลิต/ผู้นำเข้า ครั้งที่ผลิต ส่วนประกอบครบถ้วน'},
    {id:'c3', s:'ไม่พบเครื่องสำอางอันตราย', label:'ไม่พบเครื่องสำอางอันตราย เช่น ครีมกวนเอง ครีมหน้าขาว-หน้าเงาไร้ฉลาก ผลิตภัณฑ์เสี่ยงผสมสารปรอท สเตียรอยด์ ไฮโดรควิโนน', crit:true}]},
  {id:'haz', no:'2.4', title:'หมวดวัตถุอันตรายที่ใช้ในบ้านเรือน', icon:'🧴', items:[
    {id:'h1', s:'มีเลขทะเบียน อย./วอส.', label:'ผลิตภัณฑ์กำจัดแมลง ยากันยุง น้ำยาล้างห้องน้ำ น้ำยาซักฟอก มีเลขทะเบียน อย./วอส.'},
    {id:'h2', s:'วางแยกจากอาหาร/ขนมเด็ก', label:'วางแยกพื้นที่ออกจากหมวดอาหาร เครื่องดื่ม และขนมเด็กอย่างชัดเจน'}]},

const idb={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('shopstation',1);
    r.onupgradeneeded=()=>{const d=r.result;['stores','inspections','queue'].forEach(n=>d.createObjectStore(n,{keyPath:'id'}));d.createObjectStore('kv')};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(st,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,mode);const req=fn(t.objectStore(st));
    t.oncomplete=()=>res(req&&'result' in req?req.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  all(s){return this.tx(s,'readonly',o=>o.getAll())},
  get(s,k){return this.tx(s,'readonly',o=>o.get(k))},
  put(s,v,k){return this.tx(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k))},
  del(s,k){return this.tx(s,'readwrite',o=>o.delete(k))},
  replaceAll(s,arr){return this.tx(s,'readwrite',o=>{o.clear();arr.forEach(v=>o.put(v))})}
};

/* ====================== evaluate ====================== */
function evaluate(f){
  let pass=0,fail=0,unans=0;const crit=[],fails=[],warn=[];
  ALL_ITEMS.forEach(it=>{const v=f.answers[it.id];
    if(v==='y')pass++;else if(v==='n'){fail++;fails.push(it.id);if(it.crit)crit.push(it.s)}else if(!v)unans++});
  TESTS.forEach(t=>{const r=(f.tests[t.id]||{}).r;if(r==='neg')pass++;else if(r==='pos'){fail++;crit.push('พบ'+t.name+((f.tests[t.id].sample)?' ('+f.tests[t.id].sample+')':''))}});
  if((f.sources||[]).includes('peddler'))warn.push('รับสินค้าจากรถเร่/เซลส์เร่ที่ไม่ทราบที่มา');
  if(f.training==='no')warn.push('ผู้ประกอบการยังไม่เคยเข้ารับการอบรม คบส.');
  if(f.understanding==='none')warn.push('ผู้ประกอบการยังไม่เข้าใจการปฏิเสธสินค้าอันตรายจากเซลส์เร่');
  if(f.prevImprove==='none')warn.push('ไม่ได้ปรับปรุงตามคำแนะนำจากการตรวจรอบก่อน');
  const tot=pass+fail;const pct=tot?Math.round(pass*100/tot):null;
  let level='none';
  if(tot){level=crit.length?'red':pct>=PASS_PCT?'green':pct>=FAIR_PCT?'yellow':'red'}
  return {pass,fail,unans,pct,level,label:LEVELS[level].t,crit,fails,warn};
}

async function api(action,data={}){
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),45000);
  try{
    const r=await fetch(S.settings.serverUrl,{method:'POST',redirect:'follow',signal:ctl.signal,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:S.auth&&S.auth.token||'',...data})});
    const txt=await r.text();let j;try{j=JSON.parse(txt)}catch(e){throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (ตรวจสอบ URL / สิทธิ์การเข้าถึง "ทุกคน")')}
    if(!j.ok){const er=new Error(j.error||'ผิดพลาด');er.code=j.code;
      if(['AUTH_REQUIRED','DISABLED'].includes(j.code)&&!['loginGoogle','otpSend','otpVerify','ping'].includes(action)){await clearAuth(false);toast(j.error,4000);route()}
      else if(j.code==='NOT_APPROVED'&&S.auth){S.auth.user.status='pending';await idb.put('kv',S.auth,'auth');route()}
      throw er}
    if(j.user&&S.auth&&S.auth.user&&j.user.email===S.auth.user.email){const ch=j.user.role!==S.auth.user.role||j.user.status!==S.auth.user.status;S.auth.user=j.user;await idb.put('kv',S.auth,'auth');if(ch)setTimeout(route,0)}
    return j;
  }catch(e){if(e.name==='AbortError')throw new Error('หมดเวลาเชื่อมต่อ');throw e}finally{clearTimeout(tm)}
}

async function sync(manual){
  if(!S.settings.serverUrl||!authed()){updatePill();return}
  if(!navigator.onLine){if(manual)toast('ไม่มีอินเทอร์เน็ต — ข้อมูลจะส่งอัตโนมัติเมื่อออนไลน์');updatePill();return}
  if(syncing)return;syncing=true;updatePill();
  try{
    const q=(await idb.all('queue')).sort((a,b)=>a.ts-b.ts);
    for(const job of q){
      if(job.type==='s'){const rec=storeById(job.recId);
        if(rec){const u=await uploadIfData(rec.photo,`store_${rec.id}.jpg`);if(u!==rec.photo){rec.photo=u;await idb.put('stores',rec)}
          await api('saveStore',{record:rec,flat:flatStore(rec)})}}
      else if(job.type==='i'){const rec=S.inspections.find(x=>x.id===job.recId);
        if(rec){let ch=false;const out=[];for(const [k,p] of (rec.photos||[]).entries()){const u=await uploadIfData(p,`insp_${rec.id}_${k+1}.jpg`);if(u!==p)ch=true;out.push(u)}
          if(ch){rec.photos=out;await idb.put('inspections',rec)}
          await api('saveInspection',{record:rec,flat:flatInsp(rec)})}}
      else if(job.type==='ds')await api('deleteStore',{id:job.recId});
      else if(job.type==='di')await api('deleteInspection',{id:job.recId});
      await idb.del('queue',job.id);
    }
    const data=await api('list');await mergeServer(data);
    S.lastSync=Date.now();await idb.put('kv',S.lastSync,'lastSync');
    if(manual)toast('ซิงก์ข้อมูลเรียบร้อย ✓');setPending(data.pending||0);
    const v=S.route.v;if(['map','list','dash','store','report'].includes(v))route();
  }catch(e){console.warn(e);if(manual)toast('ซิงก์ไม่สำเร็จ: '+e.message,4000);S.syncErr=e.message}
  finally{syncing=false;await refreshQueueN()}
}
async function mergeServer(data){
  if(data.units){S.units=data.units;await idb.put('kv',S.units,'units')}
  const pend=new Set((await idb.all('queue')).map(j=>j.recId));
  const merge=(local,server)=>{const sm=new Map((server||[]).map(r=>[r.id,r]));const lm=new Map(local.map(r=>[r.id,r]));const out=[];
    sm.forEach((r,id)=>out.push(pend.has(id)&&lm.has(id)?lm.get(id):r));
    lm.forEach((r,id)=>{if(!sm.has(id)&&pend.has(id))out.push(r)});return out};
  S.stores=merge(S.stores,data.stores);S.inspections=merge(S.inspections,data.inspections);
  await idb.replaceAll('stores',S.stores);await idb.replaceAll('inspections',S.inspections);
}

  if(!navigator.onLine){p.textContent='📴 ออฟไลน์'+(S.queueN?` · รอส่ง ${S.queueN}`:'');p.classList.add('off');return}
  if(S.queueN){p.textContent=`⬆ รอส่ง ${S.queueN}`;p.classList.add('warn');return}

/* ====================== save / delete ====================== */
async function saveStore(rec){rec.updated=Date.now();if(!rec.created)rec.created=rec.updated;if(!rec.createdBy)rec.createdBy=me().email;rec.updatedBy=me().email;
  const i=S.stores.findIndex(s=>s.id===rec.id);if(i>=0)S.stores[i]=rec;else S.stores.push(rec);
  await idb.put('stores',rec);await enqueue('s',rec.id)}
async function saveInsp(rec){rec.updated=Date.now();if(!rec.created)rec.created=rec.updated;if(!rec.createdBy)rec.createdBy=me().email;rec.updatedBy=me().email;rec.result=evaluate(rec);
  const st=storeById(rec.storeId);if(st)rec.storeName=st.name;
  const i=S.inspections.findIndex(s=>s.id===rec.id);if(i>=0)S.inspections[i]=rec;else S.inspections.push(rec);
  await idb.put('inspections',rec);await enqueue('i',rec.id)}
async function deleteStore(id){
  for(const x of inspsOf(id)){await idb.del('inspections',x.id);await dequeue('i',x.id)}
  S.inspections=S.inspections.filter(x=>x.storeId!==id);S.stores=S.stores.filter(s=>s.id!==id);
  await idb.del('stores',id);await dequeue('s',id);await enqueue('ds',id)}
async function deleteInsp(id){S.inspections=S.inspections.filter(x=>x.id!==id);await idb.del('inspections',id);await dequeue('i',id);await enqueue('di',id)}

/* ====================== images ====================== */
function compressImage(file,max=1280,q=0.72){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('อ่านรูปไม่ได้'))};img.src=url})}
const isMobile=()=>/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
/* mode: 'camera' = เปิดกล้องถ่ายทันที, 'gallery' = เลือกจากคลังภาพ/ไฟล์ */
function pickImage(mode){
  if(mode==='camera'&&!isMobile()&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)return openCamera();
  return new Promise(res=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    if(mode==='camera')inp.setAttribute('capture','environment');
    inp.style.display='none';document.body.appendChild(inp);
    inp.onchange=async()=>{const f=inp.files[0];inp.remove();if(!f)return res(null);try{res(await compressImage(f))}catch(e){toast(e.message);res(null)}};inp.click()})}
/* กล้องในแอป (คอมพิวเตอร์/แท็บเล็ตที่มีเว็บแคม) */
function openCamera(){return new Promise(async res=>{
  const md=document.createElement('div');md.className='modal';
  md.innerHTML=`<div class="box" style="background:#000"><div class="mh" style="background:#fff"><b class="grow">📷 ถ่ายภาพ</b><button class="btn sm" data-c="flip">🔄 สลับกล้อง</button><button class="btn sm" data-c="x">ยกเลิก</button></div>
    <div class="mb" style="display:flex;align-items:center;justify-content:center;overflow:hidden"><video playsinline autoplay muted style="max-width:100%;max-height:100%"></video></div>
    <div style="padding:12px;text-align:center;background:#000"><button data-c="shot" aria-label="ถ่ายภาพ" style="width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#ef4444;cursor:pointer"></button></div></div>`;
  document.body.appendChild(md);const v=$('video',md);let stream=null,facing='environment';
  const stop=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};
  const start=async()=>{stop();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream}
    catch(e){toast(e.name==='NotAllowedError'?'ไม่ได้รับอนุญาตให้ใช้กล้อง (เปิดสิทธิ์กล้องในการตั้งค่าเบราว์เซอร์)':'เปิดกล้องไม่ได้ — ใช้ “คลังภาพ” แทน',4500);close(null)}};
  const close=val=>{stop();md.remove();res(val)};
  md.onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;
    if(b.dataset.c==='x')close(null);
    else if(b.dataset.c==='flip'){facing=facing==='environment'?'user':'environment';start()}
    else if(b.dataset.c==='shot'){if(!v.videoWidth){toast('กล้องยังไม่พร้อม');return}
      let w=v.videoWidth,h=v.videoHeight;const sc=Math.min(1,1280/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);close(c.toDataURL('image/jpeg',0.72))}};
  start()})}
const photoBtns=(label)=>`<div class="addph" data-act="cam"><b>📷</b>${label||'ถ่ายภาพ'}</div><div class="addph" data-act="gal"><b>🖼️</b>คลังภาพ</div>`;

/* ====================== geo ====================== */
function getGPS(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('อุปกรณ์ไม่รองรับ GPS'));
  navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),
    e=>rej(new Error(e.code===1?'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง (เปิดสิทธิ์ Location ในการตั้งค่าเบราว์เซอร์)':'หาตำแหน่งไม่สำเร็จ')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})})}
function parseLatLng(t){t=String(t||'').trim();if(!t)return null;let m;
  const pats=[/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/,/[?&](?:q|ll|query|destination|center)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i,/^\s*(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)\s*$/];
  for(const p of pats){m=t.match(p);if(m){const lat=+m[1],lng=+m[2];if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return {lat,lng}}}return null}
const gmapsLink=(lat,lng)=>`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
const gmapsNav=(lat,lng)=>`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
const hasLL=s=>s&&s.lat!==''&&s.lat!=null&&!isNaN(+s.lat)&&s.lng!==''&&s.lng!=null;

/* ====================== map adapter (Google Maps ถ้ามี API key, ไม่งั้น Leaflet) ====================== */
const pinSvg=c=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 34" width="28" height="38"><path d="M12 1C5.9 1 1 5.9 1 11.9 1 20.3 12 33 12 33s11-12.7 11-21.1C23 5.9 18.1 1 12 1z" fill="${c}" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="4.3" fill="#fff"/></svg>`;
let gmapsPromise=null;
function loadGoogle(key){if(window.google&&google.maps)return Promise.resolve();if(gmapsPromise)return gmapsPromise;
  gmapsPromise=new Promise((res,rej)=>{window.__gmReady=()=>res();const s=document.createElement('script');
    s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&language=th&region=TH&callback=__gmReady`;s.async=true;s.onerror=()=>rej(new Error('โหลด Google Maps ไม่ได้'));
    document.head.appendChild(s);setTimeout(()=>rej(new Error('timeout')),10000)});
  gmapsPromise.catch(()=>{gmapsPromise=null});return gmapsPromise}
async function createMap(el,{center,zoom,onClick}){
  if(S.settings.gmapKey&&navigator.onLine){try{await loadGoogle(S.settings.gmapKey);return gAdapter(el,{center,zoom,onClick})}catch(e){console.warn(e)}}
  if(!window.L){el.innerHTML='<div class="empty">โหลดแผนที่ไม่ได้ (ต้องเชื่อมต่ออินเทอร์เน็ตครั้งแรก)</div>';return null}
  const m=L.map(el,{zoomControl:true,attributionControl:true}).setView(center,zoom);
  const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'});
  osm.addTo(m);L.control.layers({'แผนที่ถนน':osm,'ภาพดาวเทียม':sat},null,{position:'topright'}).addTo(m);
  const layer=L.layerGroup().addTo(m);let pin=null,me=null;
  const icon=c=>L.divIcon({className:'pin',html:pinSvg(c),iconSize:[28,38],iconAnchor:[14,37],popupAnchor:[0,-32]});
  if(onClick)m.on('click',e=>onClick(+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6)));
  return {kind:'leaflet',
    setMarkers(list){layer.clearLayers();list.forEach(x=>L.marker([x.lat,x.lng],{icon:icon(x.color),title:x.title}).bindPopup(x.html).addTo(layer))},
    fit(pts){if(pts.length===1)m.setView(pts[0],16);else if(pts.length)m.fitBounds(pts,{padding:[40,40],maxZoom:16})},
    view(lat,lng,z){m.setView([lat,lng],z||Math.max(m.getZoom(),15))},
    pin(lat,lng){if(pin)pin.setLatLng([lat,lng]);else pin=L.marker([lat,lng],{icon:icon('#2563eb')}).addTo(m)},
    me(lat,lng){if(me)me.setLatLng([lat,lng]);else me=L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(m)},
    resize(){m.invalidateSize()},destroy(){m.remove()}}
}
function gAdapter(el,{center,zoom,onClick}){
  const g=google.maps;const m=new g.Map(el,{center:{lat:center[0],lng:center[1]},zoom,mapTypeControl:true,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy'});
  let mk=[],pin=null,me=null;const info=new g.InfoWindow();
  const icon=c=>({url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(pinSvg(c)),scaledSize:new g.Size(28,38),anchor:new g.Point(14,37)});
  if(onClick)m.addListener('click',e=>onClick(+e.latLng.lat().toFixed(6),+e.latLng.lng().toFixed(6)));
  return {kind:'google',
    setMarkers(list){mk.forEach(x=>x.setMap(null));mk=list.map(x=>{const k=new g.Marker({position:{lat:x.lat,lng:x.lng},map:m,icon:icon(x.color),title:x.title});
      k.addListener('click',()=>{info.setContent(x.html);info.open({anchor:k,map:m})});return k})},
    fit(pts){if(pts.length===1){m.setCenter({lat:pts[0][0],lng:pts[0][1]});m.setZoom(16)}else if(pts.length){const b=new g.LatLngBounds();pts.forEach(p=>b.extend({lat:p[0],lng:p[1]}));m.fitBounds(b,40)}},
    view(lat,lng,z){m.setCenter({lat,lng});m.setZoom(z||Math.max(m.getZoom(),15))},
    pin(lat,lng){if(pin)pin.setPosition({lat,lng});else pin=new g.Marker({position:{lat,lng},map:m,icon:icon('#2563eb')})},
    me(lat,lng){if(me)me.setPosition({lat,lng});else me=new g.Marker({position:{lat,lng},map:m,icon:{path:g.SymbolPath.CIRCLE,scale:8,fillColor:'#2563eb',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}})},
    resize(){},destroy(){}}
}

/* ====================== router ====================== */
const NAVMAP={store:'list',edit:'list',inspect:'list',report:'list'};
window.addEventListener('hashchange',route);
function setHeader(title,sub,back){$('#title').textContent=title;$('#subtitle').textContent=sub||'';$('#backBtn').hidden=!back}
function route(){
  if(!authed()){document.body.classList.add('authing');const sb0=$('.sumbar');if(sb0)sb0.remove();viewAuth();return}
  document.body.classList.remove('authing');
  const h=decodeURIComponent(location.hash.slice(1))||'map';const [v,a,b]=h.split('/');S.route={v,a,b};
  $$('nav.bottom button').forEach(x=>x.classList.toggle('on',x.dataset.v===(NAVMAP[v]||v)));
  const isMap=v==='map';$('#mapView').hidden=!isMap;$('#view').hidden=isMap;$('#fab').hidden=!((v==='map'||v==='list')&&canEdit());$('#fab').classList.toggle('onmap',isMap);
  const sb=$('.sumbar');if(sb)sb.remove();
  const view=$('#view');view.onclick=view.oninput=view.onchange=null;
  if(!isMap)window.scrollTo(0,0);
  switch(v){
    case 'map':setHeader('🏪 ShopStation',isSuper()&&!me().unitId?'ทุกหน่วยบริการ':myUnitName());showMap();break;
    case 'list':viewList();break;
    case 'store':viewStore(a);break;
    case 'edit':if(canEdit())viewEdit(a);else location.hash='#store/'+a;break;
    case 'inspect':if(canEdit())viewInspect(a,b);else location.hash='#store/'+a;break;
    case 'report':viewReport(a);break;
    case 'dash':viewDash();break;
    case 'settings':viewSettings();break;
    case 'users':if(isAdmin())viewUsers();else location.hash='#settings';break;
    default:location.hash='#map';
  }
}

        <label class="f"><span>ลักษณะสถานประกอบการ</span><select class="i" name="kind">${opt(STORE_KINDS,s.kind)}</select></label>
        <label class="f"><span>ชื่อเจ้าของร้าน</span><input class="i" name="owner" value="${esc(s.owner||'')}"></label>
        <label class="f"><span>ผู้ดูแลร้าน</span><input class="i" name="caretaker" value="${esc(s.caretaker||'')}"></label>
        <label class="f"><span>เบอร์โทรศัพท์</span><input class="i" name="phone" type="tel" value="${esc(s.phone||'')}"></label>
        <label class="f"><span>เลขทะเบียนพาณิชย์/ใบอนุญาต</span><input class="i" name="license" value="${esc(s.license||'')}"></label>
      </div>
      <label class="f"><span>ที่อยู่</span><input class="i" name="address" value="${esc(s.address||'')}" placeholder="บ้านเลขที่ ถนน ตำบล"></label>
      <label class="f"><span>หมายเหตุ</span><textarea class="i" name="note">${esc(s.note||'')}</textarea></label>
    </div>
    <div class="card"><h3>📷 ภาพหน้าร้าน</h3>
      <div class="photos" id="ph"></div>
    </div>

      <div class="grid2">

      </div>

    photoBtns(s.photo?'ถ่ายใหม่':'ถ่ายภาพ')};drawPh();
  const setLL=(lat,lng)=>{$('[name=lat]',v).value=lat;$('[name=lng]',v).value=lng};
  v.oninput=e=>{if(e.target.id==='gl'){const p=parseLatLng(e.target.value);const m=$('#glmsg');
    if(p){setLL(p.lat,p.lng);m.innerHTML='<span class="ok">✓ ได้พิกัดแล้ว</span>'}
    else if(e.target.value.trim()){m.innerHTML=/goo\.gl|maps\.app/.test(e.target.value)?'<span class="ng">ลิงก์แบบย่อ (maps.app.goo.gl) อ่านพิกัดไม่ได้ — เปิดลิงก์ใน Google Maps แล้วคัดลอกตัวเลขพิกัดแทน</span>':'<span class="ng">ไม่พบพิกัดในข้อความนี้</span>'}}};

    else if(act==='pick'){const cur=parseLatLng($('[name=lat]',v).value+','+$('[name=lng]',v).value);const p=await pickOnMap(cur);if(p)setLL(p.lat,p.lng)}
    else if(act==='save'){
      $$('[name]',v).forEach(i=>s[i.name]=i.value.trim());
      if(!s.village||!s.name){toast('กรุณากรอกหมู่บ้านและชื่อร้านค้า');return}
      if(!isSuper())s.unitId=s.unitId||me().unitId;

      s.by=me().name||me().email||'';
      await saveStore(s);toast('บันทึกแล้ว ✓');refreshMarkers(false);location.replace('#store/'+s.id)}
    else if(act==='del'){if(!confirm(`ลบร้าน "${s0.name}" และผลการตรวจทั้งหมด?\nไม่สามารถกู้คืนได้`))return;await deleteStore(s.id);refreshMarkers(false);toast('ลบแล้ว');location.replace('#list')}
  };
}
async function pickOnMap(cur){return new Promise(async res=>{
  const md=document.createElement('div');md.className='modal';
  md.innerHTML=`<div class="box"><div class="mh"><b class="grow">แตะบนแผนที่เพื่อปักหมุดร้าน</b><button class="btn sm" data-a="me">📍 ฉัน</button><button class="btn sm" data-a="x">ยกเลิก</button><button class="btn sm pri" data-a="ok">ใช้ตำแหน่งนี้</button></div><div class="mb" id="pm"></div><div class="small muted" id="pmt" style="padding:6px 12px">${cur?cur.lat+', '+cur.lng:'ยังไม่ได้เลือก'}</div></div>`;
  document.body.appendChild(md);let sel=cur;
  const mp=await createMap($('#pm',md),{center:cur?[cur.lat,cur.lng]:(S.settings.center||DEF_SET.center),zoom:cur?17:14,onClick:(lat,lng)=>{sel={lat,lng};mp.pin(lat,lng);$('#pmt',md).textContent=lat+', '+lng}});
  if(mp&&cur)mp.pin(cur.lat,cur.lng);setTimeout(()=>mp&&mp.resize(),100);
  const close=v=>{mp&&mp.destroy();md.remove();res(v)};
  md.onclick=async e=>{const a=e.target.closest('[data-a]');if(!a)return;
    if(a.dataset.a==='x')close(null);else if(a.dataset.a==='ok'){if(!sel){toast('แตะแผนที่เพื่อเลือกตำแหน่ง');return}close(sel)}
    else if(a.dataset.a==='me'){try{const p=await getGPS();sel=p;mp&&(mp.pin(p.lat,p.lng),mp.view(p.lat,p.lng,17));$('#pmt',md).textContent=p.lat+', '+p.lng}catch(err){toast(err.message)}}};
})}

      <p class="small muted" style="margin:6px 0 0">เกณฑ์: ≥${PASS_PCT}% ผ่าน · ${FAIR_PCT}–${PASS_PCT-1}% ต้องปรับปรุง · ต่ำกว่า ${FAIR_PCT}% หรือพบข้อสำคัญ = ไม่ผ่าน</p>`};
  const drawPh=()=>{$('#iph').innerHTML=F.photos.map((p,k)=>`<div class="ph"><img referrerpolicy="no-referrer" src="${imgSrc(p)}"><button class="x" data-rm="${k}">×</button></div>`).join('')+(F.photos.length<6?photoBtns():'')};
  upd();drawPh();
  v.onclick=async e=>{
    const tb=e.target.closest('.tri button');
    if(tb){const g=tb.parentElement;$$('button',g).forEach(x=>x.classList.toggle('on',x===tb));
      if(g.dataset.item)F.answers[g.dataset.item]=tb.dataset.v;
      if(g.dataset.test){F.tests[g.dataset.test]=Object.assign(F.tests[g.dataset.test]||{},{r:tb.dataset.v})}
      upd();return}
    const all=e.target.closest('[data-all]');
    if(all){const sec=CHECK.find(s=>s.id===all.dataset.all);sec.items.forEach(it=>F.answers[it.id]=all.dataset.val);
      $$(`[data-sec="${sec.id}"] .tri[data-item] button`).forEach(x=>x.classList.toggle('on',x.dataset.v===all.dataset.val));upd();return}
    const rm=e.target.closest('[data-rm]');if(rm){F.photos.splice(+rm.dataset.rm,1);drawPh();return}
    const b=e.target.closest('[data-act]');if(!b)return;
    if(b.dataset.act==='cam'||b.dataset.act==='gal'){const d=await pickImage(b.dataset.act==='cam'?'camera':'gallery');if(d){F.photos.push(d);drawPh()}}
    else if(b.dataset.act==='autorec'){const r=evaluate(F);const lines=[];
      r.fails.forEach(fid=>{const it=ALL_ITEMS.find(x=>x.id===fid);lines.push('• '+recFor(it))});
      TESTS.forEach(t=>{if((F.tests[t.id]||{}).r==='pos')lines.push(`• พบ${t.name}ในตัวอย่าง${F.tests[t.id].sample?' '+F.tests[t.id].sample:''} — ให้งดจำหน่ายทันที และแจ้งแหล่งที่ซื้อ`)});
      if((F.sources||[]).includes('peddler'))lines.push('• ไม่รับสินค้าจากรถเร่/เซลส์เร่ที่ไม่ทราบแหล่งที่มา ควรซื้อจากร้านค้าส่งหรือตัวแทนที่ถูกกฎหมาย');
      if(F.training==='no')lines.push('• แนะนำให้เข้ารับการอบรม คบส. ในรอบถัดไป');
      if(!lines.length){toast('ไม่มีข้อที่ไม่ผ่าน');return}
      const ta=$('#frec');ta.value=(ta.value?ta.value.trim()+'\n':'')+lines.join('\n');F.recommend=ta.value}
    else if(b.dataset.act==='save'){
      F.date=$('#fdate').value||today();F.inspector=$('#finsp').value.trim();F.recommend=$('#frec').value.trim();F.followup=$('#ffu').value;
      const r=evaluate(F);if(r.pass+r.fail===0){toast('กรุณาประเมินอย่างน้อย 1 ข้อ');return}
      if(r.unans&&!confirm(`ยังไม่ได้ตอบ ${r.unans} ข้อ (จะไม่นำมาคิดคะแนน)\nบันทึกเลยหรือไม่?`))return;

      await saveInsp(F);refreshMarkers(false);toast('บันทึกผลการตรวจแล้ว ✓');location.replace('#report/'+F.id)}
  };
  v.oninput=e=>{const t=e.target;
    if(t.dataset.note)F.notes[t.dataset.note]=t.value;
    else if(t.dataset.sample)F.tests[t.dataset.sample]=Object.assign(F.tests[t.dataset.sample]||{},{sample:t.value});
    else if(t.id==='fsrcother')F.sourceOther=t.value;else if(t.id==='ftry')F.trainingYear=t.value;else if(t.id==='frec')F.recommend=t.value};
  v.onchange=e=>{const t=e.target;
    if(t.dataset.src){F.sources=$$('[data-src]').filter(x=>x.checked).map(x=>x.dataset.src);upd()}
    else if(t.name==='tr'){F.training=t.value;upd()}else if(t.name==='un'){F.understanding=t.value;upd()}else if(t.name==='pi'){F.prevImprove=t.value;upd()}};
}

function fyStart(){const d=new Date();const y=d.getMonth()>=9?d.getFullYear():d.getFullYear()-1;return `${y}-10-01`}

  setHeader('📊 รายงาน',uName);
  const stores=S.stores.filter(s=>!RF.unit||s.unitId===RF.unit);
  const sIds=new Set(stores.map(s=>s.id));
  const insps=S.inspections.filter(i=>sIds.has(i.storeId)&&(i.date||'')>=RF.from&&(i.date||'')<=RF.to)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
  const lastIn={};insps.forEach(i=>{if(!lastIn[i.storeId])lastIn[i.storeId]=i});
  const lvIn=id=>lastIn[id]&&lastIn[id].result?lastIn[id].result.level:'none';
  const cnt={green:0,yellow:0,red:0,none:0};stores.forEach(s=>cnt[lvIn(s.id)]++);
  const done=stores.length-cnt.none;const cov=stores.length?Math.round(done*100/stores.length):0;
  const byV={};stores.forEach(s=>{const k=s.village||'(ไม่ระบุ)';byV[k]=byV[k]||{green:0,yellow:0,red:0,none:0,n:0};byV[k][lvIn(s.id)]++;byV[k].n++});
  const byU={};if(isSuper()&&!RF.unit)stores.forEach(s=>{const k=unitName(s.unitId)||'(ไม่ระบุหน่วย)';byU[k]=byU[k]||{green:0,yellow:0,red:0,none:0,n:0};byU[k][lvIn(s.id)]++;byU[k].n++});
  const latest=Object.values(lastIn);

    <div class="card"><h3>ข้อที่พบปัญหาบ่อย</h3>

function downloadCSV(name,rows){if(!rows.length){toast('ไม่มีข้อมูล');return}
  const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];const q=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='﻿'+[keys.map(q).join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))].join('\r\n');
  downloadBlob(name,new Blob([csv],{type:'text/csv;charset=utf-8'}))}
function downloadBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

      <div class="tw" style="max-height:320px;overflow-y:auto"><table class="t">${units.map(x=>`<tr data-unit="${x.id}"><td><b>${esc(x.code||'-')}</b> ${esc(x.name)}<div class="small muted">ผู้ใช้ ${users.filter(u=>u.unitId===x.id).length} คน · ร้าน ${S.stores.filter(s=>s.unitId===x.id).length} ร้าน</div></td>
        <td class="n"><button class="btn sm" data-u="ren">แก้ไข</button> <button class="btn sm danger" data-u="del">ลบ</button></td></tr>`).join('')}</table></div>
      <div class="row" style="margin-top:10px"><input class="i" id="newCode" inputmode="numeric" maxlength="5" placeholder="รหัส 5 หลัก" style="width:120px"><input class="i grow" id="newUnit" placeholder="ชื่อหน่วยบริการใหม่"><button class="btn pri" data-u="add">＋ เพิ่ม</button></div></div>`:''}
    ${(()=>{const inc=users.filter(u=>u.transferTo&&(isSuper()||u.transferTo===me().unitId));return inc.length?`<div class="card" style="border:2px solid #f59e0b"><h3>🔁 คำขอย้ายหน่วยบริการ (${inc.length})</h3>
      ${inc.map(u=>`<div class="item" data-email="${esc(u.email)}"><b>${esc(u.name||u.email)}</b> <span class="small muted">${esc(u.email)}</span><div class="small">${esc(u.position||'-')} · จาก <b>${esc(unitName(u.unitId)||u.unit||'-')}</b> → ไป <b>${esc(unitName(u.transferTo))}</b><br><span class="muted">ขอโดย ${esc(u.transferBy===u.email?'เจ้าตัว':u.transferBy)} · ${thDateTime(u.transferAt)}</span></div>
        <div class="row" style="margin-top:6px"><button class="btn pri sm" data-xd="1">✓ อนุมัติให้ย้ายเข้า</button><button class="btn danger sm" data-xd="0">ไม่อนุมัติ</button></div></div>`).join('')}</div>`:''})()}
    <div class="info">ผู้ใช้ ${users.length} คน${pend?` · <b>รออนุมัติ ${pend} คน</b>`:''}<br>
      <span class="small">${isSuper()?'ผู้ดูแลระบบสูงสุด: จัดการได้ทุกหน่วย กำหนดผู้ดูแลหน่วยบริการและย้ายหน่วยได้':'ผู้ดูแลหน่วยบริการ: อนุมัติ/ระงับ/ลบ เจ้าหน้าที่ในหน่วยของคุณ'}</span></div>
    ${isSuper()?`<select class="i" id="ufu" style="margin-bottom:10px"><option value="">ทุกหน่วยบริการ</option>${unitOpts(UF.unit)}<option value="-" ${UF.unit==='-'?'selected':''}>(ยังไม่ระบุหน่วย)</option></select>`:''}
    ${shown.map(u=>`<div class="card" data-email="${esc(u.email)}">
      <div class="acct">${avatar(u,44)}<div class="grow" style="min-width:0"><b>${esc(u.name||'(ยังไม่ระบุชื่อ)')}</b> <span class="badge ${stB[u.status]||'b-none'}">${STATUS_T[u.status]||u.status}</span>
        <div class="small muted" style="word-break:break-all">${esc(u.email)}</div><span class="small" style="color:var(--pri);font-weight:700">${ROLE_T[u.role]||u.role}</span></div></div>
      <div class="small" style="margin:8px 0">${esc(u.position||'-')} · <b>${esc(u.role==='superadmin'?'ทุกหน่วยบริการ':(unitName(u.unitId)||u.unit||'-'))}</b>${u.unitId||u.role==='superadmin'?'':' <span class="ng">(ยังไม่กำหนดหน่วย)</span>'} · ${u.phone?`<a href="tel:${esc(u.phone)}">${esc(u.phone)}</a>`:'-'}<br>
        <span class="muted">สมัคร ${thDateTime(u.created)} · เข้าใช้ล่าสุด ${thDateTime(u.lastLogin)}</span></div>
      ${u.transferTo?`<div class="note" style="margin-bottom:8px">🔁 ขอย้ายไป <b>${esc(unitName(u.transferTo))}</b> — รอผู้ดูแลหน่วยปลายทางอนุมัติ ${canManage(u)?'<button class="btn sm" data-xc>ยกเลิกคำขอ</button>':''}</div>`:''}
      ${u.email===me().email?'<div class="small muted">(บัญชีของคุณ)</div>':!canManage(u)?(u.transferTo===me().unitId&&u.unitId!==me().unitId?'<div class="small muted">(ขอย้ายเข้าหน่วยของคุณ — อนุมัติได้ที่กล่องด้านบน)</div>':'<div class="small muted">(จัดการโดยผู้ดูแลระบบสูงสุด)</div>'):`
        ${isSuper()?`<select class="i" data-unitsel style="margin-bottom:8px"><option value="">— หน่วยบริการ —</option>${unitOpts(u.unitId)}</select>`:''}
        <div class="row"><select class="i" data-role style="flex:1;min-width:140px">${roleOpts(u)}</select>
        ${u.status!=='approved'?`<button class="btn pri sm" data-st="approved">✓ ${u.status==='disabled'?'เปิดใช้งาน':'อนุมัติ'}</button>`:''}
        ${u.status!=='disabled'?'<button class="btn danger sm" data-st="disabled">ระงับ</button>':''}
        <button class="btn danger sm" data-del>🗑 ลบ</button></div>
        ${!isSuper()&&!u.transferTo&&u.status==='approved'?`<div class="row" style="margin-top:8px"><select class="i" data-xto style="flex:1;min-width:140px"><option value="">🔁 สั่งย้ายไปหน่วยบริการ…</option>${unitOpts('',u.unitId)}</select><button class="btn sm" data-xr>ส่งคำขอย้าย</button></div>`:''}`}
    </div>`).join('')||'<div class="empty">ไม่มีผู้ใช้</div>'}`;
  const call=async(action,data,el,msg)=>{el&&(el.disabled=true);try{await api(action,data);toast(msg||'อัปเดตแล้ว ✓');viewUsers()}catch(e){toast(e.message,4500);el&&(el.disabled=false)}};
  v.onclick=e=>{
    const ub=e.target.closest('[data-u]');
    if(ub){const a=ub.dataset.u;const row=ub.closest('[data-unit]');
      if(a==='add'){const n=$('#newUnit').value.trim(),cd=$('#newCode').value.trim();if(!n){toast('ใส่ชื่อหน่วยบริการ');return}if(cd&&!/^\d{5}$/.test(cd)){toast('รหัสหน่วยบริการต้องเป็นตัวเลข 5 หลัก');return}call('unitSave',{unit:{name:n,code:cd}},ub,'เพิ่มหน่วยบริการแล้ว ✓')}
      else if(a==='ren'){const uo=unitObj(row.dataset.unit)||{};const cd=prompt('รหัสหน่วยบริการ (5 หลัก)',uo.code||'');if(cd===null)return;const n=prompt('ชื่อหน่วยบริการ',uo.name||'');if(n&&n.trim())call('unitSave',{unit:{id:row.dataset.unit,name:n.trim(),code:cd.trim()}},ub)}
      else if(a==='del'){if(confirm(`ลบหน่วยบริการ "${unitName(row.dataset.unit)}"?`))call('unitDelete',{id:row.dataset.unit},ub,'ลบหน่วยบริการแล้ว')}
      return}
    const c=e.target.closest('[data-email]');if(!c)return;const email=c.dataset.email;
    const b=e.target.closest('[data-st]');
    if(b){if(b.dataset.st==='disabled'&&!confirm('ระงับการใช้งานบัญชีนี้?'))return;
      const ch={status:b.dataset.st,role:$('[data-role]',c).value};const us=$('[data-unitsel]',c);if(us)ch.unitId=us.value;
      if(b.dataset.st==='approved'&&us&&!us.value){toast('กรุณาเลือกหน่วยบริการก่อนอนุมัติ');return}
      call('userUpdate',{email,changes:ch},b);return}
    const xd=e.target.closest('[data-xd]');
    if(xd){const ok=xd.dataset.xd==='1';if(!ok&&!confirm('ไม่อนุมัติคำขอย้ายนี้?'))return;call('transferDecide',{email,approve:ok},xd,ok?'อนุมัติการย้ายแล้ว ✓':'ปฏิเสธคำขอแล้ว');return}
    const xc=e.target.closest('[data-xc]');if(xc){call('transferCancel',{email},xc,'ยกเลิกคำขอย้ายแล้ว');return}
    const xr=e.target.closest('[data-xr]');
    if(xr){const to=$('[data-xto]',c).value;if(!to){toast('เลือกหน่วยบริการปลายทาง');return}
      if(!confirm(`ส่งคำขอย้าย ${email} ไป ${unitName(to)}?\nต้องรอผู้ดูแลหน่วยบริการปลายทางอนุมัติ`))return;call('transferRequest',{email,unitId:to},xr,'ส่งคำขอย้ายแล้ว รอหน่วยปลายทางอนุมัติ');return}
    const d=e.target.closest('[data-del]');
    if(d){if(!confirm(`ลบบัญชี ${email} ออกจากระบบ?\nผู้ใช้จะต้องสมัครใหม่หากต้องการใช้งาน (ข้อมูลร้าน/ผลตรวจที่บันทึกไว้ไม่ถูกลบ)`))return;call('userDelete',{email},d,'ลบบัญชีแล้ว')}};
  v.onchange=e=>{if(e.target.id==='ufu'){UF.unit=e.target.value;viewUsers();return}
    const c=e.target.closest('[data-email]');if(!c)return;
    if(e.target.dataset.role!==undefined)call('userUpdate',{email:c.dataset.email,changes:{role:e.target.value}},e.target);
    else if(e.target.dataset.unitsel!==undefined&&e.target.value)call('userUpdate',{email:c.dataset.email,changes:{unitId:e.target.value}},e.target,'ย้ายหน่วยบริการแล้ว ✓')};
}

/* ====================== view: settings ====================== */
function viewSettings(){
  setHeader('⚙️ ตั้งค่า','');const st=S.settings;const u=me();
  $('#view').innerHTML=`
    <div class="card"><div class="acct">${avatar(u,56)}<div class="grow" style="min-width:0"><b style="font-size:17px">${esc(u.name||'-')}</b>
        <div class="small muted" style="word-break:break-all">${esc(u.email)}</div><span class="badge b-green">${ROLE_T[u.role]||u.role}</span></div></div>
      <div class="small" style="margin:10px 0">${esc(u.position||'')}${u.phone?' · '+esc(u.phone):''}<br>หน่วยบริการ: <b>${esc(myUnitName()||(isSuper()?'ทุกหน่วยบริการ':'-'))}</b></div>
      ${!u.unitId&&!isSuper()?'<div class="note">⚠ บัญชียังไม่ได้กำหนดหน่วยบริการ — บันทึกข้อมูลไม่ได้ กรุณาติดต่อผู้ดูแลระบบสูงสุด</div>':''}
      <div class="btns"><button class="btn" data-act="profile">✏️ แก้ไขข้อมูลส่วนตัว</button><button class="btn danger" data-act="logout">ออกจากระบบ</button></div>
      ${isAdmin()?`<a class="btn pri block" id="usersBtn" href="#users" style="margin-top:10px">👥 จัดการผู้ใช้ / อนุมัติผู้สมัคร${S.pending?` (รอ ${S.pending} คน)`:''}</a>`:''}
    </div>
    ${!isSuper()&&u.unitId?`<div class="card"><h3>🔁 ย้ายหน่วยบริการ</h3>
      ${u.transferTo?`<div class="note">ส่งคำขอย้ายไป <b>${esc(unitName(u.transferTo))}</b> แล้ว — รอผู้ดูแลหน่วยบริการปลายทางอนุมัติ</div><button class="btn block" data-act="xcancel">ยกเลิกคำขอย้าย</button>`:
      `<p class="small muted" style="margin-top:0">ย้ายที่ปฏิบัติงาน: เลือกหน่วยบริการใหม่ แล้วรอผู้ดูแลหน่วยบริการนั้นอนุมัติ ระหว่างรอยังใช้งานหน่วยเดิมได้ตามปกติ</p>
       ${unitPicker('xto','',u.unitId)}<button class="btn pri block" style="margin-top:8px" data-act="xreq">ส่งคำขอย้าย</button>`}
    </div>`:''}
    <div class="card"><h3>ค่าในเครื่องนี้</h3>
      <label class="f" style="margin:0"><span>รายชื่อหมู่บ้านในพื้นที่ (บรรทัดละ 1 หมู่บ้าน)</span><textarea class="i" data-k="villages" placeholder="บ้าน...&#10;บ้าน...">${esc(st.villages)}</textarea></label>
    </div>
    <div class="card"><h3>☁ การเชื่อมต่อ</h3>
      <div class="small" style="word-break:break-all">เซิร์ฟเวอร์: <span class="muted">${esc(st.serverUrl)}</span></div>
      <div class="btns" style="margin-top:8px"><button class="btn" data-act="test">🔌 ทดสอบการเชื่อมต่อ</button><button class="btn pri" data-act="sync">⟳ ซิงก์เดี๋ยวนี้</button></div>
      <p class="small muted" style="margin:8px 0 0">ซิงก์ล่าสุด: ${thDateTime(S.lastSync)} · รอส่ง ${S.queueN} รายการ · เข้าระบบถึง ${thDateTime(S.auth.exp)}${S.syncErr?`<br><span class="ng">ข้อผิดพลาดล่าสุด: ${esc(S.syncErr)}</span>`:''}</p>
    </div>
    <div class="card"><h3>🗺️ แผนที่</h3>
      <label class="f"><span>Google Maps API Key (ไม่บังคับ)</span><input class="i" data-k="gmapKey" value="${esc(st.gmapKey)}" placeholder="ว่างไว้ = ใช้แผนที่ OpenStreetMap ฟรี"></label>
      <button class="btn" data-act="center">📍 ตั้งจุดกลางแผนที่เป็นตำแหน่งปัจจุบัน</button>
    </div>
    ${isSuper()?`<div class="card"><h3>💾 สำรองข้อมูล (ผู้ดูแลระบบสูงสุด)</h3>
      <div class="btns"><button class="btn" data-act="backup">⬇ สำรองข้อมูล (JSON)</button><button class="btn" data-act="restore">⬆ นำเข้าข้อมูลสำรอง</button></div></div>`:''}
    <div class="card"><h3>📖 คู่มือการใช้งาน</h3>
      <div class="btns"><a class="btn pri" href="manual.html">📖 เปิดคู่มือ</a><a class="btn" href="manual.pdf" download="คู่มือการใช้งาน ShopStation.pdf">⬇ ดาวน์โหลด PDF</a></div></div>
    <div class="card small muted">
      <b>ShopStation</b> v3.0 — ร้าน ${S.stores.length} · ผลตรวจ ${S.inspections.length} รายการ · ${navigator.onLine?'ออนไลน์':'ออฟไลน์'}<br>
      <span id="installHint"></span>
    </div>`;
  const ih=$('#installHint');const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(!standalone)ih.innerHTML=/iphone|ipad|ipod/i.test(navigator.userAgent)?'📲 ติดตั้งบน iPhone: เปิดด้วย Safari → ปุ่มแชร์ → “เพิ่มไปยังหน้าจอโฮม”':
    (deferredInstall?'<button class="btn sm pri" id="instBtn">📲 ติดตั้งแอปลงเครื่อง</button>':'📲 ติดตั้งบน Android: เมนู ⋮ ของ Chrome → “ติดตั้งแอป / เพิ่มไปยังหน้าจอหลัก”');
  const ib=$('#instBtn');if(ib)ib.onclick=async()=>{deferredInstall.prompt();deferredInstall=null};
  const v=$('#view');
  v.onchange=async e=>{const k=e.target.dataset.k;if(!k)return;st[k]=e.target.value.trim();await saveSettings();
    if(k==='gmapKey'){mainInit=false;MAIN&&MAIN.destroy&&MAIN.destroy();MAIN=null;$('#map').innerHTML='';$('#map').className=''}
    toast('บันทึกการตั้งค่าแล้ว')};
  v.onclick=async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
    if(a==='logout')logout();
    else if(a==='xreq'){const to=pickUnitId('xto');if(to===u.unitId){toast('อยู่ในหน่วยบริการนี้อยู่แล้ว');return}if(!to){toast('เลือกหน่วยบริการใหม่');return}if(!confirm(`ขอย้ายไป ${unitName(to)}?\nต้องรอผู้ดูแลหน่วยบริการปลายทางอนุมัติ`))return;
      b.disabled=true;try{const j=await api('transferRequest',{unitId:to});S.auth.user=j.user;await idb.put('kv',S.auth,'auth');toast('ส่งคำขอย้ายแล้ว ✓');viewSettings()}catch(err){toast(err.message,4500);b.disabled=false}}
    else if(a==='xcancel'){b.disabled=true;try{const j=await api('transferCancel',{});S.auth.user=j.user;await idb.put('kv',S.auth,'auth');toast('ยกเลิกคำขอแล้ว');viewSettings()}catch(err){toast(err.message);b.disabled=false}}
    else if(a==='profile'){S.route.editProfile=true;document.body.classList.add('authing');viewRegister()}
    else if(a==='test'){b.disabled=true;try{const j=await api('me');toast(`เชื่อมต่อสำเร็จ ✓ (${ROLE_T[j.user.role]})`,3500)}catch(err){toast('เชื่อมต่อไม่สำเร็จ: '+err.message,5000)}b.disabled=false}
    else if(a==='sync')await sync(true);
    else if(a==='center'){try{const p=await getGPS();st.center=[p.lat,p.lng];st.zoom=14;await saveSettings();toast('ตั้งจุดกลางแล้ว')}catch(err){toast(err.message)}}
    else if(a==='backup')downloadBlob(`ShopStation_backup_${today()}.json`,new Blob([JSON.stringify({app:'ShopStation',ver:2,at:Date.now(),stores:S.stores,inspections:S.inspections},null,1)],{type:'application/json'}));
    else if(a==='restore'){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{
        const d=JSON.parse(await inp.files[0].text());if(!d.stores)throw new Error('ไฟล์ไม่ถูกต้อง');let n=0;
        for(const s of d.stores){const c=storeById(s.id);if(!c||(s.updated||0)>(c.updated||0)){const i=S.stores.findIndex(x=>x.id===s.id);i>=0?S.stores[i]=s:S.stores.push(s);await idb.put('stores',s);await idb.put('queue',{id:'s:'+s.id,type:'s',recId:s.id,ts:Date.now()});n++}}
        for(const s of d.inspections||[]){const c=S.inspections.find(x=>x.id===s.id);if(!c||(s.updated||0)>(c.updated||0)){const i=S.inspections.findIndex(x=>x.id===s.id);i>=0?S.inspections[i]=s:S.inspections.push(s);await idb.put('inspections',s);await idb.put('queue',{id:'i:'+s.id,type:'i',recId:s.id,ts:Date.now()});n++}}
        await refreshQueueN();scheduleSync();refreshMarkers(true);toast(`นำเข้า ${n} รายการ`);viewSettings()}catch(err){toast('นำเข้าไม่สำเร็จ: '+err.message)}};inp.click()}
  };
}

/* ====================== boot ====================== */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
window.addEventListener('online',()=>{updatePill();sync(false)});
window.addEventListener('offline',updatePill);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(false)});
(async function boot(){
  try{await idb.open()}catch(e){document.body.innerHTML='<div class="empty">เบราว์เซอร์นี้ไม่รองรับการเก็บข้อมูล (IndexedDB)<br>กรุณาใช้ Chrome หรือ Safari และไม่ใช้โหมดไม่ระบุตัวตน</div>';return}
  S.settings=Object.assign({},DEF_SET,(await idb.get('kv','settings'))||{});
  if(CONFIG.SERVER_URL&&!S.settings.serverUrl)S.settings.serverUrl=CONFIG.SERVER_URL;
  S.lastSync=(await idb.get('kv','lastSync'))||0;S.server=(await idb.get('kv','server'))||null;S.units=(await idb.get('kv','units'))||(S.server&&S.server.units)||[];
  S.auth=(await idb.get('kv','auth'))||null;
  if(S.auth&&S.auth.exp&&Date.now()>S.auth.exp){await clearAuth(false);toast('หมดเวลาการเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่',4000)}
  S.stores=await idb.all('stores');S.inspections=await idb.all('inspections');
  await refreshQueueN();route();if(authed())sync(false);
  setInterval(()=>{if(!document.hidden)sync(false)},120000);
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e));
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
</script>
